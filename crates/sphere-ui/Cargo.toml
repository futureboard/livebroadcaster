[package]
name = "sphere-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Sphere UI for egui: the Futureboard SphereUIComponents design system (tokens, themes, components) ported from GPUI to egui, with system fonts and Lucide icons"
publish = false

[dependencies]
egui = "0.31.1"
resvg = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
